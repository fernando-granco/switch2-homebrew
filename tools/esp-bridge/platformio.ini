[platformio]
default_envs = esp8266

[env:esp8266]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
board_build.flash_mode = dio
board_build.f_flash = 40000000L

[esp32_base]
platform = espressif32@8.0.0
framework = arduino

[env:esp32]
extends = esp32_base
board = esp32dev

[env:esp32c3]
extends = esp32_base
board = esp32-c3-devkitm-1

[env:esp32s3]
extends = esp32_base
board = esp32-s3-devkitc-1
